packages:
  - 'dev/**'
  - 'packages/**'
  - 'internals/**'
  - 'models/**'
  - 'docs/**'
  - 'tmp/bundlers/**'
  # exclude packages that are inside demo directories
  - '!models/**/demo/**'
  - '!dev/browser/public/models/**'
  - '!docs/workers/upscale/**'

overrides:
  webpack: 5.96.1

allowBuilds:
  '@tensorflow/tfjs-node': true
  '@tensorflow/tfjs-node-gpu': true
  core-js: true
  core-js-pure: true
  esbuild: true
  puppeteer: true
  workerd: true

useNodeVersion: 24.18.0

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Renovate security update: ejs@3.1.10
  - ejs@3.1.10
  # Renovate security update: esbuild@0.25.0
  - esbuild@0.25.0
