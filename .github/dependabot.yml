version: 2
updates:
  # pnpm workspace: a single root lockfile (pnpm-lock.yaml) covers every member.
  # Point Dependabot at '/' so the workspace root — and that shared lockfile — is
  # in scope. Splitting updates by sub-package directory (e.g. /packages/upscalerjs)
  # bumps the member package.json but leaves the root lockfile stale, breaking
  # `pnpm install --frozen-lockfile` in CI. See dependabot-core#11135.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # pnpm 11 enables `minimumReleaseAge: 1440` (1-day quarantine on freshly
    # published packages) by default. Dependabot ignores it and resolves to the
    # newest version, so its regenerated lockfile can contain sub-1-day packages
    # that CI then rejects (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). Hold updates
    # for 3 days so the picked versions clear the gate with margin. Note: cooldown
    # constrains the directly-updated dependency, not transitives re-floated during
    # lockfile regeneration — see dependabot-core#13165 — so occasional failures
    # may persist until that's resolved upstream.
    cooldown:
      default-days: 3

