name: 'Tests'
# `push` alone means a pull request from a fork never runs these tests: the push
# happens in the contributor's fork, so no run appears here and the `CI Gate` in
# pr-monitor.yml times out waiting for one. Adding `pull_request` is what gives
# external contributors CI at all.
on: [push, pull_request]

# Keyed on the branch name rather than the ref so that a same-repo pull request,
# which fires both `push` and `pull_request`, collapses into a single run instead
# of testing the same commit twice. `github.head_ref` is set only on pull_request
# events; `github.ref_name` covers the push side.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TF_CPP_MIN_LOG_LEVEL: 2

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Lint'
        run: 'pnpm lint'

  unit-browser-vite:
    name: 'Unit / Browser / Vite'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Unit Tests / Vite'
        working-directory: ./packages/upscalerjs
        run: pnpm test:unit:browser:vite

      - name: 'Upload Unit Browser Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-test-unit-browser-vite
          path: |
            ./packages/upscalerjs/coverage/coverage-final.json

  unit-browser-playwright:
    name: 'Unit / Browser / Playwright'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Unit Tests / Playwright'
        working-directory: ./packages/upscalerjs
        run: pnpm test:unit:browser:playwright

      - name: 'Upload Unit Browser Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-test-unit-browser-playwright
          path: |
            ./packages/upscalerjs/.nyc_output/coverage-pw.json


  unit-node:
    name: 'Unit / Node'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Unit Tests'
        working-directory: ./packages/upscalerjs
        run: pnpm test:unit:node

      - name: 'Upload Unit Node Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-test-unit-node
          path: ./packages/upscalerjs/coverage/coverage-final.json

  shared-unit:
    name: 'Shared / Unit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Unit Tests'
        working-directory: ./packages/shared
        run: pnpm test

  internal-unit:
    name: 'Internals / Unit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Unit Tests'
        working-directory: ./internals
        run: pnpm test

  upload-to-codecov:
    name: 'Upload to CodeCov'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ unit-node, unit-browser-vite, unit-browser-playwright ]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: 'Codecov'
        uses: codecov/codecov-action@v5
        with:
          verbose: true

  integration-browserstack:
    name: 'Integration / Browserstack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not exposed to workflows triggered by a pull request from a
    # fork, so this job cannot authenticate there and would fail for reasons
    # unrelated to the change under test. Same-repo pull requests still run it.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: 'BrowserStack Env Setup'  # Invokes the setup-env action
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: 'Start BrowserStack Local'  # Tunnels the runner's localhost to the cloud browsers
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-identifier: random

      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true


      - name: 'Integration Tests'
        run: pnpm test:integration:browserstack
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: 'Stop BrowserStack Local'
        if: always()
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop

  integration-clientside:
    name: 'Integration / Clientside'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Integration Tests'
        run: pnpm test:integration:clientside
        env:
          NODE_OPTIONS: --max_old_space_size=8192

  integration-serverside:
    name: 'Integration / Serverside'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true

      - name: 'Integration Tests'
        run: pnpm test:integration:serverside

  integration-models-browser:
    name: 'Models / Browser'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # strategy:
    #   matrix:
    #     node-version: [16]
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true
      - name: 'Integration Tests'
        run: pnpm test:integration:model:clientside

  # TEMPORARY diagnostic job. The tfjs-node addon is present immediately after
  # `pnpm install` and absent ~40s later when the tests run; the only thing in
  # between is `bundle:node`, which runs a second, workspace-wide
  # `pnpm install --ignore-scripts --fix-lockfile` from tmp/bundlers/node.
  # This job captures the store state on both sides of that step. Remove once
  # the cause is confirmed.
  debug-tfjs:
    name: 'Debug / tfjs addon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'State before bundle:node'
        run: |
          cp pnpm-lock.yaml /tmp/lock-before.yaml
          echo '--- virtual store dirs ---'
          ls -d node_modules/.pnpm/@tensorflow* || true
          echo '--- addons ---'
          find node_modules/.pnpm -name 'tfjs_binding.node' -printf '%p %s\n' || true
          echo '--- root symlink target ---'
          readlink -f node_modules/@tensorflow/tfjs-node || true
          readlink -f node_modules/@tensorflow/tfjs-node-gpu || true

      - name: 'Run bundle:node'
        run: pnpm bundle:node

      - name: 'State after bundle:node'
        if: always()
        run: |
          echo '--- virtual store dirs ---'
          ls -d node_modules/.pnpm/@tensorflow* || true
          echo '--- addons ---'
          find node_modules/.pnpm -name 'tfjs_binding.node' -printf '%p %s\n' || true
          echo '--- root symlink target ---'
          readlink -f node_modules/@tensorflow/tfjs-node || true
          readlink -f node_modules/@tensorflow/tfjs-node-gpu || true
          echo '--- bundler symlink target ---'
          readlink -f tmp/bundlers/node/node_modules/@tensorflow/tfjs-node || true
          echo '--- lockfile diff, tfjs context ---'
          diff /tmp/lock-before.yaml pnpm-lock.yaml | grep -C3 -i 'tfjs\|supports-color' | head -120 || true
          echo '--- lockfile diff total lines ---'
          diff /tmp/lock-before.yaml pnpm-lock.yaml | wc -l || true

      - name: 'Does require still work?'
        if: always()
        run: |
          node -e "require('@tensorflow/tfjs-node'); console.log('REQUIRE OK')" || true

      # The post-bundle lockfile is what pnpm 11 actually resolves to. Committing
      # it makes the bundler's install a no-op instead of a 4k-line rewrite.
      - name: 'Upload re-resolved lockfile'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-after-bundle
          path: pnpm-lock.yaml

  integration-models-node:
    name: 'Models / Node'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Integration Tests'
        run: pnpm test:integration:model:serverside

  integration-memory-leaks:
    name: 'Integration / Memory Leaks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: 'Memory Leak Tests'
        run: pnpm test:integration:memory-leaks

  build-docs:
    name: 'Build Documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Setup PNPM with Node 22'
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true

      - name: 'Install dependencies'
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: 'Build'
        working-directory: ./docs
        run: pnpm build
