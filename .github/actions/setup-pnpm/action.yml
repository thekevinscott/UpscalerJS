name: Setup PNPM
description: "Sets up PNPM"

inputs:
  node-version:
    description: 'Node Version'
    required: true

runs:
  using: "composite"
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@v4
      with:
        version: 11
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-${{ inputs.node-version }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.node-version }}-pnpm-store-

    # Cache the Chrome that puppeteer's postinstall downloads to ~/.cache/puppeteer.
    # Without this, every browser job re-downloads Chrome from Google's CDN on each
    # run; on a cold cache they all hit it at once and time out (ETIMEDOUT / stall).
    # Restoring here means postinstall finds Chrome already present and skips the
    # download. `restore-keys` lets an older Chrome cache satisfy a lockfile bump
    # when puppeteer itself didn't change. Skipped where the browser isn't needed.
    - uses: actions/cache@v4
      name: Setup puppeteer Chrome cache
      if: env.PUPPETEER_SKIP_DOWNLOAD != 'true'
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Install dependencies
      shell: bash
      # Force-skip puppeteer's auto-download here regardless of the job-level
      # setting: two workspace packages depend on puppeteer, so pnpm runs their
      # postinstalls concurrently and they race on the shared ~/.cache/puppeteer
      # (one unlinks the temp .zip the other still expects -> ENOENT). Chrome is
      # installed once, serially, by the step below instead.
      # `--frozen-lockfile` fails fast on lockfile drift; `timeout` is the backstop
      # since composite-action steps don't support `timeout-minutes`.
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: timeout 600 pnpm install --frozen-lockfile

    - name: Verify tfjs-node native addons
      shell: bash
      run: node ${{ github.action_path }}/verify-native-addons.mjs

    - name: Install Chrome for Puppeteer
      # Runs only for jobs that need a browser (job-level PUPPETEER_SKIP_DOWNLOAD
      # unset). Single invocation of puppeteer's own installer -> no concurrent
      # race. On a warm ~/.cache/puppeteer (restored above) it detects the existing
      # browser and is a no-op; otherwise it downloads the pinned Chrome once.
      if: env.PUPPETEER_SKIP_DOWNLOAD != 'true'
      shell: bash
      run: node node_modules/puppeteer/install.mjs

    # - name: Install dependencies
    #   shell: bash
    #   run: pnpm install

    # - name: Install Puppeteer explicitly
