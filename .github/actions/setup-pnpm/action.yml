name: Setup PNPM
description: "Sets up PNPM"

inputs:
  node-version:
    description: 'Node Version'
    required: true

runs:
  using: "composite"
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@v4
      with:
        version: 11
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    # The `-v2` salt is an escape hatch. `restore-keys` falls back on a prefix
    # match, so a corrupt store survives lockfile changes indefinitely -- that is
    # how the July 2026 tfjs-node breakage persisted. Bump the salt to abandon
    # every existing store without needing the cache API.
    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-${{ inputs.node-version }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.node-version }}-pnpm-store-v2-

    # Cache the Chrome that puppeteer's postinstall downloads to ~/.cache/puppeteer.
    # Without this, every browser job re-downloads Chrome from Google's CDN on each
    # run; on a cold cache they all hit it at once and time out (ETIMEDOUT / stall).
    # Restoring here means postinstall finds Chrome already present and skips the
    # download. `restore-keys` lets an older Chrome cache satisfy a lockfile bump
    # when puppeteer itself didn't change. Skipped where the browser isn't needed.
    - uses: actions/cache@v4
      name: Setup puppeteer Chrome cache
      if: env.PUPPETEER_SKIP_DOWNLOAD != 'true'
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Install dependencies
      shell: bash
      # Force-skip puppeteer's auto-download here regardless of the job-level
      # setting: two workspace packages depend on puppeteer, so pnpm runs their
      # postinstalls concurrently and they race on the shared ~/.cache/puppeteer
      # (one unlinks the temp .zip the other still expects -> ENOENT). Chrome is
      # installed once, serially, by the step below instead.
      # `--frozen-lockfile` fails fast on lockfile drift; `timeout` is the backstop
      # since composite-action steps don't support `timeout-minutes`.
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: timeout 600 pnpm install --frozen-lockfile

    # @tensorflow/tfjs-node ships its native addon outside the npm tarball and
    # fetches it in its own `install` script. That script runs node-pre-gyp via
    # `cp.exec` without forwarding stdout/stderr, so when the addon is not
    # produced the script still exits 0 and pnpm reports `Done` -- there is
    # nothing in the log to see. The failure only surfaces minutes later as a
    # vitest "Failed Suites" on `require('@tensorflow/tfjs-node')`. Assert the
    # addon exists here so a bad install fails at install time.
    - name: Verify tfjs-node native addons
      shell: bash
      run: |
        node -e "
        const fs = require('fs'), path = require('path');
        for (const pkg of ['@tensorflow/tfjs-node', '@tensorflow/tfjs-node-gpu']) {
          const dir = path.dirname(require.resolve(pkg + '/package.json'));
          const addon = path.join(dir, 'lib', 'napi-v8', 'tfjs_binding.node');
          if (!fs.existsSync(addon)) {
            console.error('Missing native addon for ' + pkg + ': ' + addon);
            process.exit(1);
          }
        }
        require('@tensorflow/tfjs-node');
        "

    - name: Install Chrome for Puppeteer
      # Runs only for jobs that need a browser (job-level PUPPETEER_SKIP_DOWNLOAD
      # unset). Single invocation of puppeteer's own installer -> no concurrent
      # race. On a warm ~/.cache/puppeteer (restored above) it detects the existing
      # browser and is a no-op; otherwise it downloads the pinned Chrome once.
      if: env.PUPPETEER_SKIP_DOWNLOAD != 'true'
      shell: bash
      run: node node_modules/puppeteer/install.mjs

    # - name: Install dependencies
    #   shell: bash
    #   run: pnpm install

    # - name: Install Puppeteer explicitly
    #   shell: bash
    #   run: node node_modules/puppeteer/install.js

    # - name: Re-install @tensorflow/tfjs-node
    #   shell: bash
    #   run: cd node_modules/@tensorflow/tfjs-node && pnpm run install
